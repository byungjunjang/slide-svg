<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    Football Field Chart Template
    Usage: valuation ranges per method as floating low-high bars on one value axis, plus reference lines (current price, offer price) — M&A or investment memo, 4-8 methods
    Geometry: x(v) = 380 + (v - 6,000) / 15 (axis 6,000-18,000 KRW over x 380-1180)
    Rows: pitch 84px, bar height 40px, bar y = 170 + 84 x (row - 1); bar x = x(low), width = x(high) - x(low)
    Single accent: valuation methods = accent at fill-opacity 0.85, market reference (52-week range) = accent at 0.35
    Native marker: none. A native bar chart starts every bar at zero, so floating ranges stay SVG geometry
    -->

    <g id="header">
        <text x="60" y="58" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
              font-size="32" font-weight="700" fill="{{TOKEN:colors.text}}">제시 가격은 네 가지 가치평가 범위 안에 있다</text>
        <text x="60" y="92" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
              font-size="18" fill="{{TOKEN:colors.text-secondary}}">방법별 주당 가치 범위(원) · 점선 = 현재 주가와 제시 가격</text>
    </g>

    <g id="chartArea">
        <!-- Value grid: 3,000 KRW per 200px -->
        <line x1="380" y1="150" x2="380" y2="580" stroke="{{TOKEN:colors.border}}" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="580" y1="150" x2="580" y2="580" stroke="{{TOKEN:colors.border}}" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="780" y1="150" x2="780" y2="580" stroke="{{TOKEN:colors.border}}" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="980" y1="150" x2="980" y2="580" stroke="{{TOKEN:colors.border}}" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="1180" y1="150" x2="1180" y2="580" stroke="{{TOKEN:colors.border}}" stroke-width="1" stroke-dasharray="4,4"/>

        <!-- Value axis -->
        <line x1="380" y1="580" x2="1180" y2="580" stroke="{{TOKEN:colors.text-secondary}}" stroke-width="2"/>
        <text x="380" y="604" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}" text-anchor="middle">6,000</text>
        <text x="580" y="604" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}" text-anchor="middle">9,000</text>
        <text x="780" y="604" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}" text-anchor="middle">12,000</text>
        <text x="980" y="604" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}" text-anchor="middle">15,000</text>
        <text x="1180" y="604" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}" text-anchor="middle">18,000</text>

        <!-- Row 1: 상장 비교기업, 9,000-13,500 -->
        <g id="row-1">
            <text x="60" y="187" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="600" fill="{{TOKEN:colors.text}}">상장 비교기업</text>
            <text x="60" y="206" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}">EV/EBITDA 8–11배</text>
            <rect x="580" y="170" width="300" height="40" fill="{{TOKEN:colors.accent}}" fill-opacity="0.85"/>
            <text x="572" y="195" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}" text-anchor="end">9,000</text>
            <text x="888" y="195" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}">13,500</text>
        </g>

        <!-- Row 2: 거래 사례, 10,500-15,000 -->
        <g id="row-2">
            <text x="60" y="271" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="600" fill="{{TOKEN:colors.text}}">거래 사례</text>
            <text x="60" y="290" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}">최근 3년 인수 6건</text>
            <rect x="680" y="254" width="300" height="40" fill="{{TOKEN:colors.accent}}" fill-opacity="0.85"/>
            <text x="672" y="279" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}" text-anchor="end">10,500</text>
            <text x="988" y="279" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}">15,000</text>
        </g>

        <!-- Row 3: DCF, 11,100-16,500 -->
        <g id="row-3">
            <text x="60" y="355" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="600" fill="{{TOKEN:colors.text}}">현금흐름할인(DCF)</text>
            <text x="60" y="374" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}">WACC 8–10% · 영구성장 1–2%</text>
            <rect x="720" y="338" width="360" height="40" fill="{{TOKEN:colors.accent}}" fill-opacity="0.85"/>
            <text x="712" y="363" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}" text-anchor="end">11,100</text>
            <text x="1088" y="363" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}">16,500</text>
        </g>

        <!-- Row 4: LBO, 8,400-13,200 -->
        <g id="row-4">
            <text x="60" y="439" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="600" fill="{{TOKEN:colors.text}}">차입매수(LBO)</text>
            <text x="60" y="458" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}">목표 IRR 20–25%</text>
            <rect x="540" y="422" width="320" height="40" fill="{{TOKEN:colors.accent}}" fill-opacity="0.85"/>
            <text x="532" y="447" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}" text-anchor="end">8,400</text>
            <text x="868" y="447" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}">13,200</text>
        </g>

        <!-- Row 5: 52주 주가 범위 (market reference, lighter), 7,800-11,250 -->
        <g id="row-5">
            <text x="60" y="523" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="600" fill="{{TOKEN:colors.text}}">52주 주가 범위</text>
            <text x="60" y="542" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}">시장 참고값</text>
            <rect x="500" y="506" width="230" height="40" fill="{{TOKEN:colors.accent}}" fill-opacity="0.35"/>
            <text x="492" y="531" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}" text-anchor="end">7,800</text>
            <text x="738" y="531" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}">11,250</text>
        </g>

        <!-- Reference lines, drawn last: current price 9,300 (x 600), offer 13,050 (x 850); keep them clear of the value labels -->
        <line x1="600" y1="148" x2="600" y2="580" stroke="{{TOKEN:colors.text-secondary}}" stroke-width="2" stroke-dasharray="6,4"/>
        <text x="600" y="140" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text-secondary}}" text-anchor="middle">현재 주가 9,300</text>
        <line x1="850" y1="148" x2="850" y2="580" stroke="{{TOKEN:colors.text}}" stroke-width="2" stroke-dasharray="6,4"/>
        <text x="850" y="140" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}" text-anchor="middle">제시 가격 13,050</text>
    </g>

    <text x="60" y="644" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
          font-size="13" fill="{{TOKEN:colors.text-secondary}}">막대 = 방법별 주당 가치 범위 · 수치는 예시</text>
</svg>
