<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    Tornado Chart Template
    Usage: one-at-a-time sensitivity of one output (IRR, NPV, EBIT) to 4-10 drivers, downside / upside bars around a base-case line, sorted by swing (widest on top)
    Geometry: x(v) = 380 + (v - 10) x 32 (axis 10%-35% over x 380-1180); base line x = x(22.5) = 780
    Downside bar: x = x(low), width = 780 - x(low). Upside bar: x = 780, width = x(high) - 780
    Rows: pitch 76px, bar height 36px, bar y = 166 + 76 x (row - 1)
    Single accent: upside = accent, downside = accent at fill-opacity 0.45
    Native marker: none. A native bar chart starts every bar at zero, so bars around a base value stay SVG geometry
    -->

    <g id="header">
        <text x="60" y="58" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
              font-size="32" font-weight="700" fill="{{TOKEN:colors.text}}">지분 IRR 은 매출 성장률에 가장 민감하다</text>
        <text x="60" y="92" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
              font-size="18" fill="{{TOKEN:colors.text-secondary}}">가정 하나씩만 바꾸고 나머지는 기준값 유지 · 막대 길이 = IRR 변동폭</text>
    </g>

    <g id="legend">
        <rect x="900" y="80" width="14" height="14" rx="3" fill="{{TOKEN:colors.accent}}" fill-opacity="0.45"/>
        <text x="922" y="92" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
              font-size="14" fill="{{TOKEN:colors.text-secondary}}">하방 시나리오</text>
        <rect x="1040" y="80" width="14" height="14" rx="3" fill="{{TOKEN:colors.accent}}"/>
        <text x="1062" y="92" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
              font-size="14" fill="{{TOKEN:colors.text-secondary}}">상방 시나리오</text>
    </g>

    <g id="chartArea">
        <!-- Value grid: 5%p per 160px -->
        <line x1="380" y1="146" x2="380" y2="602" stroke="{{TOKEN:colors.border}}" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="540" y1="146" x2="540" y2="602" stroke="{{TOKEN:colors.border}}" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="700" y1="146" x2="700" y2="602" stroke="{{TOKEN:colors.border}}" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="860" y1="146" x2="860" y2="602" stroke="{{TOKEN:colors.border}}" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="1020" y1="146" x2="1020" y2="602" stroke="{{TOKEN:colors.border}}" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="1180" y1="146" x2="1180" y2="602" stroke="{{TOKEN:colors.border}}" stroke-width="1" stroke-dasharray="4,4"/>

        <!-- Value axis -->
        <line x1="380" y1="602" x2="1180" y2="602" stroke="{{TOKEN:colors.text-secondary}}" stroke-width="2"/>
        <text x="380" y="626" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}" text-anchor="middle">10%</text>
        <text x="540" y="626" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}" text-anchor="middle">15%</text>
        <text x="700" y="626" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}" text-anchor="middle">20%</text>
        <text x="860" y="626" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}" text-anchor="middle">25%</text>
        <text x="1020" y="626" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}" text-anchor="middle">30%</text>
        <text x="1180" y="626" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}" text-anchor="middle">35%</text>

        <!-- Row 1: 매출 성장률, 13.0% / 33.0% -->
        <g id="row-1">
            <text x="60" y="181" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="600" fill="{{TOKEN:colors.text}}">매출 성장률</text>
            <text x="60" y="200" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}">하방 연 5% · 상방 연 15%</text>
            <rect x="476" y="166" width="304" height="36" fill="{{TOKEN:colors.accent}}" fill-opacity="0.45"/>
            <rect x="780" y="166" width="336" height="36" fill="{{TOKEN:colors.accent}}"/>
            <text x="468" y="189" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}" text-anchor="end">13.0%</text>
            <text x="1124" y="189" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}">33.0%</text>
        </g>

        <!-- Row 2: EBIT 마진, 15.5% / 30.0% -->
        <g id="row-2">
            <text x="60" y="257" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="600" fill="{{TOKEN:colors.text}}">EBIT 마진</text>
            <text x="60" y="276" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}">하방 8% · 상방 14%</text>
            <rect x="556" y="242" width="224" height="36" fill="{{TOKEN:colors.accent}}" fill-opacity="0.45"/>
            <rect x="780" y="242" width="240" height="36" fill="{{TOKEN:colors.accent}}"/>
            <text x="548" y="265" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}" text-anchor="end">15.5%</text>
            <text x="1028" y="265" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}">30.0%</text>
        </g>

        <!-- Row 3: 출구 배수, 17.0% / 28.5% -->
        <g id="row-3">
            <text x="60" y="333" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="600" fill="{{TOKEN:colors.text}}">출구 배수</text>
            <text x="60" y="352" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}">하방 6배 · 상방 10배</text>
            <rect x="604" y="318" width="176" height="36" fill="{{TOKEN:colors.accent}}" fill-opacity="0.45"/>
            <rect x="780" y="318" width="192" height="36" fill="{{TOKEN:colors.accent}}"/>
            <text x="596" y="341" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}" text-anchor="end">17.0%</text>
            <text x="980" y="341" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}">28.5%</text>
        </g>

        <!-- Row 4: 투자 원금, 18.5% / 26.5% -->
        <g id="row-4">
            <text x="60" y="409" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="600" fill="{{TOKEN:colors.text}}">투자 원금</text>
            <text x="60" y="428" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}">하방 1,200억 · 상방 900억</text>
            <rect x="652" y="394" width="128" height="36" fill="{{TOKEN:colors.accent}}" fill-opacity="0.45"/>
            <rect x="780" y="394" width="128" height="36" fill="{{TOKEN:colors.accent}}"/>
            <text x="644" y="417" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}" text-anchor="end">18.5%</text>
            <text x="916" y="417" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}">26.5%</text>
        </g>

        <!-- Row 5: 부채 비율, 19.5% / 25.0% -->
        <g id="row-5">
            <text x="60" y="485" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="600" fill="{{TOKEN:colors.text}}">부채 비율</text>
            <text x="60" y="504" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}">하방 40% · 상방 60%</text>
            <rect x="684" y="470" width="96" height="36" fill="{{TOKEN:colors.accent}}" fill-opacity="0.45"/>
            <rect x="780" y="470" width="80" height="36" fill="{{TOKEN:colors.accent}}"/>
            <text x="676" y="493" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}" text-anchor="end">19.5%</text>
            <text x="868" y="493" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}">25.0%</text>
        </g>

        <!-- Row 6: 차입 금리, 20.5% / 24.0% -->
        <g id="row-6">
            <text x="60" y="561" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="600" fill="{{TOKEN:colors.text}}">차입 금리</text>
            <text x="60" y="580" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="{{TOKEN:colors.text-secondary}}">하방 6% · 상방 4%</text>
            <rect x="716" y="546" width="64" height="36" fill="{{TOKEN:colors.accent}}" fill-opacity="0.45"/>
            <rect x="780" y="546" width="48" height="36" fill="{{TOKEN:colors.accent}}"/>
            <text x="708" y="569" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}" text-anchor="end">20.5%</text>
            <text x="836" y="569" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}">24.0%</text>
        </g>

        <!-- Base-case line drawn last so it stays visible across the bars -->
        <line x1="780" y1="140" x2="780" y2="608" stroke="{{TOKEN:colors.text}}" stroke-width="2"/>
        <text x="780" y="132" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="600" fill="{{TOKEN:colors.text}}" text-anchor="middle">기준 22.5%</text>
    </g>

    <text x="60" y="664" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
          font-size="13" fill="{{TOKEN:colors.text-secondary}}">위에서부터 변동폭이 큰 가정 순 · 수치는 예시</text>
</svg>
